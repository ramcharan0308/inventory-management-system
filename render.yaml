# Render Blueprint — backend + PostgreSQL
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free

services:
  - type: web
    name: inventory-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: APP_NAME
        value: Inventory Management API
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app,http://localhost:5173
      - key: LOW_STOCK_THRESHOLD
        value: "10"
    autoDeploy: true
